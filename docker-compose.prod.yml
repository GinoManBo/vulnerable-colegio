# ─────────────────────────────────────────────
#  PRODUCTION: Usa imágenes de Docker Hub
# ─────────────────────────────────────────────
# Uso:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Asegúrate de configurar las variables de entorno
# en un archivo .env antes de ejecutar.
# ─────────────────────────────────────────────

services:
  frontend:
    image: ginomanbo/vulnerable-colegio-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  backend:
    image: ginomanbo/vulnerable-colegio-backend:latest
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/vulnerable-colegio
      PORT: 5000
      NODE_ENV: production
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - uploads_data:/app/uploads

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mongo_data:
  uploads_data:

networks:
  app-network:
    driver: bridge
